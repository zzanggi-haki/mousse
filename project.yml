name: Mousse
options:
  bundleIdPrefix: com.zzanggi
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Mousse:
    type: application
    platform: macOS
    sources:
      - path: Mousse
    info:
      path: Mousse/Info.plist
      properties:
        CFBundleName: Mousse
        CFBundleDisplayName: Mousse
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.2"
        LSUIElement: true
    entitlements:
      path: Mousse/Mousse.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzanggi.mousse
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Mousse/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mousse/Mousse.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
